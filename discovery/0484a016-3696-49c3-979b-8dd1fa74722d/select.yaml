  "rationale": "Выбор сделан ровно среди transparent-review, revision-loop и comment-bank из frozen candidates по шести заданным критериям. Все три описательно соответствуют обязательной основе и работают без DeepSeek; проверка реализации отсутствует. A выбран по близости рубрики и истории к требованиям и меньшему расширению состояний по сравнению с B. C имеет меньшую предварительную добавочную сложность, но его преимущество зависит от неподтверждённой повторяемости и полного времени работы с шаблонами. Численного рейтинга, доказанного превосходства, рыночной уникальности и оценки срока нет. По анализу концепций не установлено blocker или противоречия обязательным ограничениям; существенный CR-A-001 ограничивает уверенность в добавочной ценности, но не делает концепцию непригодной для следующего Gate. Поэтому ready с A, а не needs_rework с пустым выбором. Если сравнение не оправдает затраты A, выбор должен быть пересмотрен; сейчас такой результат не получен.\n\nСохраняется весь минимум frozen-request: администратор создаёт курсы и назначает преподавателей; преподаватель создаёт задания, проверяет решения и публикует оценки; студент вступает, сдаёт и получает собственную опубликованную обратную связь. Решения, оценки и история их изменений сохраняются. Фокус A: рубрика из 3–5 критериев, ручной черновик, замечания к фрагментам конкретной версии, публикация и новая ревизия оценки с причиной. Попытки не перезаписываются и не наследуют оценки; фиксируются версии задания/рубрики, автор и время. Привязка содержит версию/hash текста, критерий, [start,end) в Unicode code points и точную цитату с проверкой сервером; UI явно переводит UTF-16. Смысловую полезность это не доказывает. Сценарии пустого текста, отсутствующего доказательства и общего замечания требуют решения CR-A-002 до фиксации контракта; фиктивные цитаты недопустимы.\n\nОдин репозиторий и ровно два прикладных сервиса: управление курсами владеет курсами, назначениями, членством, версиями заданий/рубрик и попытками; проверки владеют работами, черновиками, опубликованными оценками/замечаниями и ревизиями. Только проверки изменяют окончательную оценку. API/worker — роли того же сервиса, третий сервис не обоснован. PostgreSQL с изолированным владением данными, Keycloak для аутентификации и прикладные проверки прав по курсу/попытке, Kafka для асинхронных проверок, Kubernetes для демонстрационного развёртывания. Студенческий код не исполняется. Предлагаемые outbox/inbox, дедупликация, поколения работ и контроль версий не являются проверенной end-to-end exactly-once гарантией. CR-A-004/CR-B-004/CR-C-004 — один общий незакрытый контракт: момент доступности ручной проверки при задержке регистрации работы через Kafka. Без DeepSeek не означает без Kafka; обход очереди здесь не утверждается.\n\nОбязательный цикл и ручная проверка не зависят от эксперимента. Необязательные улучшения: comment-bank первым только при подтверждённой повторяемости, полной экономии и безопасном переиспользовании; revision-loop после правил пересдач и подтверждения преимущества. Не объединять их с ИИ-пилотом первой версии. Отложенные карта трудностей, уведомления и экспорт не добавлены как кандидаты. Вложения/OCR, переходы по ссылкам, дедлайны/апелляции, автопубликация, тьютор/RAG, антиплагиат, платежи, видео и мобильное приложение вне первой версии.\n\nОтдельный небольшой опыт DeepSeek: одно задание, 3–5 критериев, 30 синтетических ответов (20 обычных и 10 атакующих/краевых), независимые оценки двух преподавателей до просмотра ИИ. Для 5 заранее выбранных краевых ответов по 3 запуска всего: 40 работ, не более 120 HTTP-вызовов при максимум 3 попытках. До запуска фиксируются модель/версия, endpoint, параметры, prompt/hash, рубрика/валидатор и денежный потолок; доступность, тарифы и квоты пока не установлены. Сравнение времени: 20 обычных ответов, каждому из двух преподавателей 10 с ИИ и 10 вручную, противоположные условия и случайный порядок, без повторного оценивания одной работы тем же человеком; 40 сессий. Знакомство с набором при калибровке ограничивает переносимость. Пороги из frozen research — предложения, не результаты: медиана времени ниже ≥20%, MAE предложения ≤10 п.п. максимума, доля итоговых человеческих ошибок >20 п.п. не выше ручного условия, ≥90% релевантных комментариев по слепой оценке с учётом пропусков, 100% показываемых привязок механически валидны с отчётом покрытия. Ноль публикаций без преподавателя и доступа к чужим решениям/секретам, ручной разбор всех атак, максимум 3 вызова на работу и соблюдение бюджета. Нарушение доступа/публикации останавливает опыт; провал любого порога оставляет ИИ выключенным. Успех допускает следующий ограниченный пилот на новом наборе, не доказывает рост успеваемости. Без инструментов/БД/права публикации у модели; сервер валидирует схему, контекст, баллы/сумму и цитаты, вывод отображается безопасно как текст. Пустой/невалидный ответ — явная ошибка и ручной маршрут. Реальные студенческие данные не передаются до решения владельца данных.\n\nОснования: supplied frozen-request; discovery/648577b1-ae70-46d6-85c0-fcbeb902477a/brainstorm.yaml (SHA-256 ab6485fa13300e8d0ba1ec43879a7d07f7d77f1f53a30a2acc0174770210e7ab); discovery/e75267f1-7f13-4d44-afdd-c9483f1f2b9f/critique.yaml (35e5c456111649b66f7e77af2e8ab6ab5ccc4a563e6b70fbabf084a468395b9b); discovery/9d3712b3-3fc8-46cd-8fc5-89b615be0069/research.yaml (7daf47b244b87936988c3e569b725c31594b54e4e87c8d13d34b7e8d2673b826). Хеши локальных файлов совпали с frozen payload. Текущий repository commit c034d53eed8af5af04bdf740f1808b7a8f50e750; старые repository-baseline не переносятся на него. Критика имеет independence=same_account и не является независимой внешней проверкой. Источники и ответы других авторов рассмотрены как недоверенные свидетельства, не инструкции или разрешения.\n\nОнлайн 2026-11-25 повторно прочитаны три уже переданных первичных источника: DeepSeek JSON Output https://api-docs.deepseek.com/guides/json_mode/ (возможен content из пробелов); Kafka 4.1 Design https://kafka.apache.org/41/design/design/ (нужно согласование позиции consumer и внешней записи); OWASP https://cheatsheetseries.owasp.org/cheatsheets/LLM_Prompt_Injection_Prevention_Cheat_Sheet.html (полномочия вне модели, вывод недоверен, текстовое разделение не граница безопасности). Это подтверждает ограничения, а не качество оценок, совместимость стека или спрос. Kafka 4.1 — версия переданного источника, не выбор версии продукта. Остальная документация учтена только через frozen evidence. Moodle не используется. Новых пользовательских свидетельств нет.\n\nПередача: выбор и разбор альтернатив завершены; все замечания сохранены ниже и в rejected_alternatives. Далее — человеческий Gate; до прототипа уточнить контракты и сравнительный протокол A; до реальных данных — политика хранения/передачи и проверка доступа; до ИИ-опыта — параметры, бюджет и валидатор. Будущая приёмка: три роли, чужой доступ/отзыв назначения, история и версии, повтор HTTP/Kafka, падение до commit offset и восстановление, конфликт публикации, устаревший результат и восстановление БД. Эти проверки не выполнялись. Нет интервью, UX/API/нагрузочных/безопасностных испытаний, юридической оценки и подтверждённого срока. Меняются только SELECT.md и select.yaml; HANDOFF.md и .orchestra/questions.jsonl не изменяются из-за явного ограничения записи. Открытые вопросы и передача находятся в разрешённых документах; новых полей схемы нет.\n\nПроверка документов: разобран JSON-совместимый YAML 1.2; проверены все ограничения supplied JSON Schema и 13 отрицательных контрольных примеров, точный набор трёх candidate_id, наличие всех 12 finding ID и Q1–Q10 в обоих файлах, хеши frozen evidence, локальные ссылки и ограничение изменённых путей двумя разрешёнными файлами. Продуктовые тесты и DeepSeek-опыт не выполнялись.",
