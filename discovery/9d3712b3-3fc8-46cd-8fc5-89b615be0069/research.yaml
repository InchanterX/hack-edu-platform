  "summary": "Предварительная доказательная база для EduPlatform: исходный запрос требует двух прикладных сервисов и ручного решения преподавателя; онлайн-документация подтверждает ограничения JSON-ответов DeepSeek и доставки Kafka. Рекомендации и эксперимент уточняются в следующей исследовательской редакции.",
