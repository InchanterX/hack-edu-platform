{
  "summary": "Рекомендована концепция EduPlatform «Прозрачная проверка»: три роли, ручная рубрика, замечания к фрагментам и неизменяемая история попыток/оценок. Один репозиторий, два прикладных сервиса, PostgreSQL, Kafka, Keycloak и Kubernetes; без исполнения кода. Сравнены пять идей ценности; B–D отложены, DeepSeek выделен в отдельный отключаемый пилот на синтетических ответах с решением преподавателя. Полнота partial: доступные источники прочитаны, но Moodle недоступен, потребность, API и предлагаемые гипотезы не проверены.",
  "questions": [
    "Какая концепция дополнительной ценности лучше соответствует обязательному циклу трёх ролей без расширения MVP?",
    "Какие функции обязательны, какие отложить и что выделить в отдельный эксперимент?",
    "Как разделить два сервиса, сохранить решения/оценки/историю и обработать повторы Kafka без ложной гарантии exactly-once?",
    "Какие ограничения и проверки нужны для DeepSeek, недоверенного текста и привязки замечаний к фрагментам?",
    "Какие измеримые пороги позволят решить, стоит ли продолжать ИИ-пилот?"
  ],
  "source_mode": "online",
  "completeness": "partial",
