  "findings": [
    {
      "text": "Исходный запрос фиксирует три роли, создание курсов и назначение преподавателей администратором, задания/проверку/оценки преподавателем, вступление/сдачу/обратную связь студентом, сохранение решений, оценок и истории.",
      "category": "fact",
      "sources": [
        "frozen-request"
      ]
    },
    {
      "text": "Исходный запрос требует одного репозитория и двух прикладных сервисов (управление курсами и проверки), Kafka, PostgreSQL, Keycloak и Kubernetes. Код студентов не исполняется; DeepSeek предлагает, преподаватель принимает окончательное решение, текст студента недоверен.",
      "category": "fact",
      "sources": [
        "frozen-request"
      ]
    },
    {
      "text": "Во frozen inputs отсутствуют приложения, reference_artifacts и selected_references; локальный frozen commit содержит только README. Существующая реализация и пользовательские исследования не предоставлены.",
      "category": "fact",
      "sources": [
        "frozen-request",
        "repository-baseline"
      ]
    },
    {
      "text": "DeepSeek документирует response_format=json_object, указание JSON в prompt, ограничение длины ответа и возможный content из пробелов, в том числе при finish_reason=stop.",
      "category": "fact",
      "sources": [
        "deepseek-json"
      ]
    },
    {
      "text": "DeepSeek описывает 429 как превышение лимитов, 500 как серверную ошибку и 503 как перегрузку; документация не является измерением доступности или качества оценок.",
      "category": "fact",
      "sources": [
        "deepseek-errors"
      ]
    },
    {
      "text": "Kafka отдельно оговаривает согласование позиции потребителя с результатом при записи во внешнее хранилище.",
      "category": "fact",
      "sources": [
        "kafka-semantics"
      ]
    },
    {
      "text": "PostgreSQL объединяет локальные изменения транзакцией с атомарным завершением или откатом.",
      "category": "fact",
      "sources": [
        "postgres-transactions"
      ]
    },
    {
      "text": "Keycloak предоставляет OIDC certificate endpoint с публичными ключами realm в JWK и endpoint introspection для confidential clients.",
      "category": "fact",
      "sources": [
        "keycloak-oidc"
      ]
    },
    {
      "text": "Kubernetes Deployment управляет желаемым состоянием Pods и ReplicaSets; эта документация не подтверждает сохранность базы данных приложения.",
      "category": "fact",
      "sources": [
        "kubernetes-deployment"
      ]
    },
    {
      "text": "OWASP не считает фильтрацию входного текста границей безопасности; рекомендует ограничивать полномочия вне модели и считать её вывод недоверенным.",
      "category": "fact",
      "sources": [
        "owasp-injection"
      ]
    },
    {
      "text": "Рекомендуемая концепция — «Прозрачная проверка»: кабинет курса, ручная рубрика, замечания к точным фрагментам, публикация преподавателем и история. Выбор обоснован соответствием обязательной истории и направлению рубрики, а не доказанным спросом или превосходством над LMS.",
      "category": "inference",
      "sources": [
        "frozen-request"
      ]
    },
    {
      "text": "Рабочий пилот: взрослые студенты, короткие русскоязычные текстовые решения; код принимается только как текст. Предлагаемый лимит 20 000 Unicode code points не является лимитом DeepSeek; отдельно проверяется токеновый бюджет модели, молчаливое усечение запрещено. Вложения, OCR и переходы по ссылкам вне MVP.",
      "category": "inference",
      "sources": [
        "frozen-request"
      ]
    },
    {
      "text": "Минимум администратора: вход через Keycloak, создание курса и назначение преподавателя. Административная роль сама по себе не открывает решения всех студентов.",
      "category": "inference",
      "sources": [
        "frozen-request"
      ]
    },
    {
      "text": "Минимум преподавателя: назначенные курсы; задания и версионируемые рубрики из 3–5 критериев с максимумами; просмотр попыток; версионируемый черновик проверки; публикация; исправление оценки новой ревизией с причиной.",
      "category": "inference",
      "sources": [
        "frozen-request"
      ]
    },
    {
      "text": "Минимум студента: вход, вступление по коду, задания и рубрика, отправка текста, номер попытки и статус, собственная опубликованная обратная связь, новая попытка без перезаписи. Дедлайны и опоздания вне MVP.",
      "category": "inference",
      "sources": [
        "frozen-request"
      ]
    },
    {
      "text": "Сервис управления курсами владеет курсами, назначениями, членством, версиями заданий/рубрик, неизменяемыми попытками и outbox; он может отдавать UI. Сервис проверок владеет работами, версиями ручных проверок, опубликованными оценками/замечаниями, предложениями DeepSeek, inbox/outbox. Только он является владельцем окончательных оценок. API и worker — роли одного сервиса; третий прикладной сервис не обоснован.",
      "category": "inference",
      "sources": [
        "frozen-request"
      ]
    },
    {
      "text": "Допустим один PostgreSQL с изолированными схемами и пользователями двух приложений без доступа к чужим таблицам; Keycloak получает отдельную БД/пользователя. В Kubernetes нужны два Deployment/Service, HTTPS-вход, readiness и лимиты ресурсов; состояние инфраструктуры требует PVC либо внешнего ресурса и проверки восстановления. Демостенд без HA не является production.",
      "category": "inference",
      "sources": [
        "frozen-request",
        "postgres-transactions",
        "kubernetes-deployment"
      ]
    },
    {
      "text": "Сервисы проверяют подпись, issuer, audience и срок токена; роли совмещаются, но права ограничены курсом/попыткой. Сервис проверок подтверждает полномочия через внутренний API управления курсами и отказывает при недоступности проверки. Worker использует ограниченную сервисную идентичность. Keycloak не заменяет прикладную проверку членства.",
      "category": "inference",
      "sources": [
        "frozen-request",
        "keycloak-oidc"
      ]
    },
    {
      "text": "Предлагаемые сущности: Course, TeachingAssignment, Enrollment, AssignmentVersion, RubricVersion, SubmissionVersion, ReviewRevision, GradeRevision, CommentAnchor, CheckJob, inbox/outbox. Попытка фиксирует точные версии задания и рубрики; новая рубрика не пересчитывает старые оценки.",
      "category": "inference",
      "sources": [
        "frozen-request"
      ]
    },
    {
      "text": "SubmissionVersion сохраняет автора, курс/задание, номер попытки, исходный текст/hash, время сервера и версии задания/рубрики. Idempotency key ограничен пользователем и операцией; повтор с иным текстом даёт конфликт. ReviewRevision и GradeRevision сохраняют автора, время, причину и исходную попытку, включая историю черновиков. Студент видит только опубликованное. Append-only приложения не защищает от администратора БД.",
      "category": "inference",
      "sources": [
        "frozen-request"
      ]
    },
    {
      "text": "Публикация проверки и ревизия оценки происходят одной транзакцией сервиса проверок. Оптимистическая версия предотвращает конкурирующее затирание. Новая попытка не наследует старую оценку; интерфейс различает последнюю попытку и последнюю оценённую. Политика удаления данных должна быть определена отдельно от сохранения истории.",
      "category": "inference",
      "sources": [
        "frozen-request",
        "postgres-transactions"
      ]
    },
    {
      "text": "CommentAnchor содержит submission_version_id, text_hash, start/end, quote и criterion_id. Диапазон [start,end) — Unicode code points сохранённого текста; переносы фиксируются при приёме, UTF-16 индексы UI переводятся. Сервер сверяет границы и точную цитату; недостоверная привязка отклоняется.",
      "category": "inference",
      "sources": [
        "frozen-request"
      ]
    },
    {
      "text": "Попытка и ReviewRequested записываются одной PostgreSQL-транзакцией в сервисе курсов; outbox публикует в Kafka и отмечается после подтверждения. Повторная доставка допустима. Kafka не является единственным архивом решений или оценок.",
      "category": "inference",
      "sources": [
        "frozen-request",
        "kafka-semantics",
        "postgres-transactions"
      ]
    },
    {
      "text": "Предлагаемый конверт события: event_id, schema_version, course_id, assignment_version_id, submission_version_id, rubric_version_id, text_hash, check_generation, correlation_id, occurred_at. Ключ партиции — submission_version_id. Текст, пользовательские токены и секреты не включаются; снимок решения и рубрики получается защищённым внутренним API.",
      "category": "inference",
      "sources": [
        "frozen-request"
      ]
    },
    {
      "text": "Consumer сервиса проверок сохраняет inbox и CheckJob одной транзакцией, затем подтверждает offset. Уникальны event_id и (submission_version_id,rubric_version_id,check_generation). Worker использует lease для восстановления зависшей работы. Результат и событие результата идут через outbox; проекция статуса в курсах идемпотентна. Это проектируемая идемпотентность, не end-to-end exactly-once.",
      "category": "inference",
      "sources": [
        "kafka-semantics",
        "postgres-transactions"
      ]
    },
    {
      "text": "Фоновая работа имеет queued/running/completed/failed, ручная проверка — draft/published/revised. Без ИИ работа регистрирует готовность ручной проверки. Предлагается максимум 3 API-вызова на работу с backoff/jitter, затем явная ошибка и ручной маршрут. Lease и таймаут согласуются. Повтор внешнего вызова после падения возможен и входит в бюджет. Запоздалый результат не заменяет более новую публикацию или поколение.",
      "category": "inference",
      "sources": [
        "frozen-request",
        "deepseek-errors"
      ]
    },
    {
      "text": "Публикация требует защищённого действия преподавателя; событие Kafka и ответ модели не получают это право. Студент не видит неопубликованного предложения; ошибка/ожидание не превращаются в ноль баллов. Ручная проверка работает при отключённом DeepSeek.",
      "category": "inference",
      "sources": [
        "frozen-request"
      ]
    },
    {
      "text": "Данные решения отделяются от инструкций и рубрики; разделение текста само по себе не обеспечивает безопасность. Модель не получает инструментов/БД и работает с одной обезличенной попыткой. Схема, идентификаторы, баллы, сумма, цитаты и диапазоны проверяются сервером; вывод экранируется как текст. До решения о внешней передаче используются только синтетические материалы. Это ограничение последствий, а не доказанная защита от инъекций.",
      "category": "inference",
      "sources": [
        "frozen-request",
        "owasp-injection"
      ]
    },
    {
      "text": "Необязательные улучшения: личный банк комментариев, цикл доработки, карта трудностей, уведомления и экспорт истории. B–D не совмещать с ИИ-пилотом в первой версии. За границами: автопубликация, универсальный тьютор, RAG/векторная БД, антиплагиат, платежи, видеокурсы, мобильное приложение, выполнение кода и новые прикладные сервисы.",
      "category": "inference",
      "sources": [
        "frozen-request"
      ]
    },
    {
      "text": "Минимальная наблюдаемость: возраст outbox/очереди, длительность работ, ошибки, повторы, стоимость API и correlation id; полный текст решений не пишется в обычные логи.",
      "category": "inference",
      "sources": []
