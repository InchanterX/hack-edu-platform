      "access": "read",
      "excerpt": "Нужно исследовать и предложить концепцию учебной платформы EduPlatform.\n\nОбязательная основа:\n— Три роли: администратор, преподаватель, студент.\n— Администратор создаёт курсы и назначает преподавателей.\n— Преподаватель создаёт задания, просматривает решения и выставляет оценки.\n— Студент присоединяется к курсу, отправляет решения и получает обратную связь.\n— Решения, оценки и история их изменения сохраняются.\n\nАрхитектурные ограничения:\n— Один репозиторий.\n— Два прикладных сервиса: управление курсами и сервис проверок.\n— Допустимо несколько дополнительных прикладных сервисов, если их необходимость обоснована.\n— Взаимодействие для асинхронных проверок через Kafka.\n— Хранение данных в PostgreSQL.\n— Аутентификация через Keycloak.\n— Развёртывание в Kubernetes.\n— Исполнение студенческого кода в первую версию не входит.\n\nНаправление эксперимента:\nИИ-помощник через DeepSeek API предлагает оценку по рубрике\nи замечания с привязкой к конкретным фрагментам решения.\nОкончательное решение принимает преподаватель.\nСтуденческий текст считается недоверенными данными.\n\nПредложить несколько отличающихся идей дополнительной ценности.\nДля каждой описать пользовательский сценарий, пользу, сложность,\nриски и проверяемую гипотезу. Не раздувать первую версию.\n\nВыбрать рекомендуемую концепцию, выделить обязательный минимум,\nнеобязательные улучшения и отдельный небольшой эксперимент.\nНе начинать реализацию продукта.",
