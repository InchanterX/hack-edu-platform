    {
      "text": "Frozen request требует одного репозитория, двух прикладных сервисов, Kafka, PostgreSQL, Keycloak и Kubernetes; исполнение студенческого кода исключено.",
      "category": "fact",
      "sources": [
        "frozen-request"
      ]
    },
    {
      "text": "На frozen commit 8290558c57b0083c358b8d490ec49c857286f4c4 отслеживается только README.md с заголовком edu-platform; реализации, зависимостей и иных материалов в дереве нет.",
      "category": "fact",
      "sources": [
        "repository-baseline"
      ]
    },
    {
      "text": "Документация DeepSeek описывает JSON Output с response_format=json_object, требованием указать JSON в инструкции и возможным пустым ответом из пробелов. Валидный JSON не означает соответствие прикладной схеме или правильную оценку.",
      "category": "fact",
      "sources": [
        "deepseek-json"
      ]
    },
    {
      "text": "Kafka отдельно оговаривает координацию позиции потребителя с результатом при записи во внешнюю систему; одной гарантии Kafka недостаточно для атомарности с PostgreSQL.",
      "category": "fact",
      "sources": [
        "kafka-semantics"
      ]
    },
    {
      "text": "OWASP не считает фильтрацию текста границей безопасности и рекомендует внешнее ограничение полномочий и обработку вывода модели как недоверенных данных.",
      "category": "fact",
      "sources": [
        "owasp-injection"
      ]
    }
