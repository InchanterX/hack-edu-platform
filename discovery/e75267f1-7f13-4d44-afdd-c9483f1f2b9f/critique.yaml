едоверенные свидетельства, а не инструкции. Сопоставлены frozen payload и локальные brainstorm.yaml (SHA-256 ab6485fa13300e8d0ba1ec43879a7d07f7d77f1f53a30a2acc0174770210e7ab) и research.yaml (SHA-256 7daf47b244b87936988c3e569b725c31594b54e4e87c8d13d34b7e8d2673b826). Текущий supplied repository commit — 3080e33c6c1ee3aec09c4c1de773b6320990f9e8; старый repository-baseline исследования не переносится на него. На 2026-11-25 повторно открыты шесть уже приведённых первичных источников: https://api-docs.deepseek.com/guides/json_mode/ ; https://api-docs.deepseek.com/quick_start/error_codes/ ; https://kafka.apache.org/41/design/design/ ; https://www.postgresql.org/docs/current/tutorial-transactions.html ; https://kubernetes.io/docs/concepts/workloads/controllers/deployment/ ; https://cheatsheetseries.owasp.org/cheatsheets/LLM_Prompt_Injection_Prevention_Cheat_Sheet.html . Онлайн-документация подтверждает только опубликованные при чтении положения, не совместимость выбранного стека, качество оценивания или состояние прошлых снимков. Moodle не использован. Новых пользовательских свидетельств, интервью и результатов опытов нет.\n\nВсе шесть критериев рассмотрены для каждого кандидата. Соответствие и инфраструктурные ограничения соблюдены в описании, не проверены в продукте. Добавочная ценность — гипотеза для каждого. Сложность A малая–средняя, B средняя, C малая лишь относительно общей основы; без данных о команде, ресурсах и сроке это не оценка выполнимости всего MVP. Риски A: затраты ручной разметки и смысловая полезность; B: состояния доработки и ложное закрытие ошибки; C: шаблонные ошибки, чужие данные и устаревшие критерии. Проверяемость ограничена неполными протоколами CR-A-001/003, CR-B-002 и CR-C-001. Для каждого отсутствие зависимости от DeepSeek сохраняется, но поведение ручного пути при задержке Kafka требует решения (CR-*-004). История не устанавливает срок хранения и не защищает от администратора БД. Синтетический ИИ-опыт не проверяет спрос на A/B/C.\n\nОТКРЫТЫЕ ВОПРОСЫ — ОТВЕТОВ НЕ ОЖИДАЕМ. Допущения позволяют закончить критику, не утверждают будущие продуктовые контракты.\nQ1. Предмет, возраст, язык и формат? Пока взрослые, короткие русскоязычные тексты без вложений; переносимость на другие форматы не заявлять.\nQ2. Разрешена ли передача в DeepSeek, каковы юрисдикция, условия и сроки хранения? Пока только синтетические материалы и выключенный ИИ; правовая оценка не выполнена.\nQ3. Каковы шкала, правила пересдачи и выбора итоговой оценки, дедлайны и апелляции? Пока сумма критериев, отдельные попытки и ревизии с причиной; B отложен до явных правил, дедлайны/апелляции вне MVP.\nQ4. Каковы доступная модель/версия, бюджет, квоты и задержки API? Пока не запускать опыт до фиксации параметров и потолка; цены/доступность не установлены.\nQ5. Каковы нагрузка, ресурсы команды, срок демонстрации и цель восстановления? Пока демо без HA/SLA и без обещания срока; относительную сложность не считать сметой.\nQ6. Как выдаются и совмещаются роли, ограничиваются коды вступления и отзывается назначение? Пока оператор Keycloak и проверки прав по курсу/попытке; реальные контракты требуют проверки, в том числе совмещения ролей.\nQ7. Как совместить историю с удалением данных и backup? Пока синтетическое демо без пользовательского удаления; до реальных данных нужны сроки и правила удаления/обезличивания/восстановления. Это не правовой вывод.\nQ8. Какова приоритетная боль: понимание, исправление или повторный ввод? Пока A выбран по соответствию требованиям; порядок A/C/B может измениться после проверки потребности.\nQ9. Каковы поведение ручного пути при задержке очереди, способ обратной связи без подходящей цитаты и совместимость шаблонов с версиями рубрик? Для критики не предполагаются ни обход Kafka, ни обязательная фиктивная привязка, ни автоматический перенос шаблонов; это открытые решения CR-*-004, CR-A-002, CR-C-003.\n\nПЕРЕДАЧА. Сделано: оценка всех трёх кандидатов по всем критериям, стабильные ID замечаний, основания, предлагаемые проверки, условный выбор и нерешённые вопросы. Остаётся вне этой задачи: уточнить контракты и политику данных, провести сравнения с базовым сценарием, затем решить о прототипе и его приёмке. Ловушки: не выдавать пороги за результаты, не суммировать общий CR-*-004 как разные дефекты, не считать JSON защитой от инъекций, не обещать exactly-once или SLA, не переносить старый baseline. Записываются только CRITIQUE.md и critique.yaml; root HANDOFF.md и запрещённый .orchestra/questions.jsonl не изменяются из-за явного ограничения владения. Вопросы и передача находятся в summary, поскольку additionalProperties=false не допускает специальных полей. JSON-совместимый YAML 1.2. Продукт, API, UX и безопасность не тестировались.\n\nПРОВЕРКА ДОКУМЕНТОВ. Пройдена встроенная проверка всех ограничений supplied JSON Schema и 12 отрицательных контрольных примеров. Подтверждены точный набор трёх frozen candidate_id, 12 уникальных finding ID (по 4 на кандидата), 5 major/7 minor, основания и предлагаемые проверки каждого замечания, согласованность ID/Q1–Q9 и локальных ссылок двух документов. Проверка git diff --check пройдена; область изменений ограничена двумя разрешёнными файлами. Это проверка артефактов, не проверка продукта.",
