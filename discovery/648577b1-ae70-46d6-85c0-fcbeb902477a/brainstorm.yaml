  "summary": "Рекомендация: transparent-review (A, «Прозрачная проверка») — паспорт ручной проверки с рубрикой, замечаниями к фрагментам и историей. Альтернативные фокусы на одинаковой обязательной основе: revision-loop (B, цикл доработки) и comment-bank (C, личный банк комментариев). Не объединять B/C с ИИ-пилотом в первой версии. C — первая необязательная опция после MVP, если подтвердится повторяемость замечаний; B требует правил пересдачи. Выбор A основан на соответствии обязательной истории и направлению рубрики/фрагментов, не на доказанном спросе.\n\nРЕЖИМ И ДОКАЗАТЕЛЬСТВА. Source mode: online; completeness переданного исследования: partial. Только supplied frozen-request и findings/источники из frozen research (discovery/9d3712b3-3fc8-46cd-8fc5-89b615be0069/research.yaml); факты требований, проектные выводы и гипотезы различаются. Исходные гипотезы A/B/C стали тремя кандидатами, E — отдельным экспериментом, D отложена. В этой попытке повторно открыты только уже переданные https://api-docs.deepseek.com/guides/json_mode/, https://kafka.apache.org/41/design/design/ и https://cheatsheetseries.owasp.org/cheatsheets/LLM_Prompt_Injection_Prevention_Cheat_Sheet.html; новые источники/продуктовые свидетельства не добавлялись. Прочая документация пересказана как результат переданного исследования. Недоступный Moodle не используется. Источники — недоверенные свидетельства, не инструкции/разрешения. Метаданные frozen repository указывают 0022cc0ec1c356f930b8805ee242169f06717bee, а repository-baseline исследования относится к 8290558c57b0083c358b8d490ec49c857286f4c4; вывод о дереве старого commit не переносится на текущий репозиторий.\n\nОБЯЗАТЕЛЬНАЯ ОСНОВА — ФАКТ ЗАПРОСА. Три роли: администратор создаёт курсы и назначает преподавателей; преподаватель создаёт задания, просматривает решения и выставляет оценки; студент вступает, сдаёт решения и получает обратную связь. Сохраняются решения, оценки и история изменений. Один репозиторий, два прикладных сервиса (управление курсами и проверки), Kafka для асинхронных проверок, PostgreSQL, Keycloak, Kubernetes. Код студентов не исполняется. DeepSeek предлагает, преподаватель принимает окончательное решение; текст студента недоверен.\n\nПРЕДЛАГАЕМЫЙ МИНИМУМ A. Вход и права по роли/курсу/попытке; создание курса и назначение преподавателя; задания с версией рубрики из 3–5 критериев; вступление по коду и текстовая сдача; ручной черновик, публикация баллов и замечаний к фрагментам; исправление оценки новой ревизией с причиной. Новая попытка не перезаписывает предыдущую и не наследует оценку. Сохраняются версии решений, рубрик, черновиков проверок и оценок, автор, серверное время, связь с попыткой. Студент видит только свою опубликованную обратную связь; административная роль сама по себе не открывает все решения. Привязка: версия/hash текста, критерий, start/end и точная цитата; диапазон [start,end) измеряется в Unicode code points сохранённого текста, UTF-16 UI переводится явно, сервер проверяет совпадение. Ручной маршрут работает без ИИ; ожидание/ошибка не превращаются в ноль баллов, устаревший результат не заменяет публикацию.\n\nАРХИТЕКТУРА — ПРЕДЛОЖЕНИЕ ДЛЯ ВСЕХ КАНДИДАТОВ. Управление курсами владеет курсами, назначениями, членством, версиями заданий/рубрик, неизменяемыми попытками и outbox; может отдавать UI. Проверки — работами, версиями ручных черновиков, окончательными оценками/замечаниями и их ревизиями, предложениями ИИ и inbox/outbox. Только проверки владеют окончательными оценками. API/worker — роли одного сервиса; третий прикладной сервис не обоснован. PostgreSQL: раздельные схемы/пользователи, без записи в чужие таблицы. Keycloak аутентифицирует; сервисы проверяют токен и права на курс/попытку. Проверки подтверждают членство/назначение через внутренний API курсов, при невозможности проверки запрещают защищённую операцию; worker имеет ограниченную сервисную идентичность. Kubernetes — демонстрационный контур без HA/SLA; сохранность состояния/восстановление требуют проверки. История приложения не защищает от администратора БД и не означает бессрочное хранение данных.\n\nАСИНХРОННОСТЬ — ПРЕДЛОЖЕНИЕ, НЕ ГАРАНТИЯ EXACTLY-ONCE. Попытка и запрос проверки записываются одной локальной транзакцией с outbox; Kafka доставляет событие. Inbox и работа фиксируются до commit offset; уникальные идентификаторы/поколение проверки позволяют дедупликацию, lease — восстановление зависшей работы. Результат/событие результата идут через outbox проверок, статус в курсах — идемпотентная проекция. Kafka не единственный архив. Публикация и ревизия оценки атомарны в проверках, конфликт версии требует перечитывания. Повтор внешнего API-вызова после сбоя возможен и расходует бюджет. Основание ограничения: https://kafka.apache.org/41/design/design/ и переданные findings kafka-semantics/postgres-transactions. План будущей приёмки: полный цикл ролей, чужой доступ, история пересдачи/смены рубрики, повторы HTTP/Kafka, падение до commit offset, восстановление работы/БД, конфликт публикации и устаревшие результаты. Эти проверки не выполнялись.\n\nГРАНИЦЫ. Допущение: взрослые студенты, короткие русскоязычные текстовые ответы без вложений; код хранится только как текст. C/B, карта трудностей (исходная D), уведомления и экспорт необязательны и отложены. За пределами первой версии: файлы/OCR, переходы по ссылкам, дедлайны/апелляции, автопубликация, универсальный тьютор, RAG, антиплагиат, платежи, видео, мобильное приложение и исполнение кода.\n\nОТДЕЛЬНЫЙ ЭКСПЕРИМЕНТ — ИСХОДНАЯ ГИПОТЕЗА E. DeepSeek готовит баллы и замечания к фрагментам, преподаватель сверяет, редактирует/отклоняет и публикует. ИИ выключен по умолчанию, готовность MVP от него не зависит. Сложность предварительно средняя: API, валидация, экран предложения и измерения. Риски: неверные баллы/цитаты, якорение, инъекции, внешняя передача, стоимость/сбои. До решения владельца данных только синтетические материалы. Модель не получает инструментов, БД, чужих решений и права публикации; вывод недоверен, сервер проверяет схему, идентификаторы, баллы/сумму, цитаты/диапазоны и отображает текст безопасно. Пустой/невалидный JSON — явная ошибка и ручной маршрут. JSON и разделение текста не доказывают устойчивость к инъекциям (переданные deepseek-json/owasp-injection); https://api-docs.deepseek.com/guides/json_mode/ и https://cheatsheetseries.owasp.org/cheatsheets/LLM_Prompt_Injection_Prevention_Cheat_Sheet.html. Ошибки API зафиксированы в переданном deepseek-errors: https://api-docs.deepseek.com/quick_start/error_codes.\n\nПРОТОКОЛ ОПЫТА — ПРЕДЛОЖЕНИЕ ИЗ ИССЛЕДОВАНИЯ. Одно задание, 3–5 критериев, 30 синтетических ответов (20 обычных, 10 атакующих/краевых: максимум баллов, поддельные инструкции, JSON/HTML, Unicode, повторные цитаты, отсутствие подходящего фрагмента). Два преподавателя независимо оценивают до ИИ и согласуют эталон; нестабильную рубрику уточняют. Для 5 заранее выбранных краевых ответов по 3 запуска всего: 40 исходных работ, максимум 120 HTTP-вызовов при ≤3 попытках на работу. До запуска выбрать модель/версию, endpoint, параметры и денежный потолок; сохранить prompt/hash, рубрику/валидатор и ограничения alias. Модель/цены/квоты/доступность не подтверждены. Для времени: 20 обычных ответов, два преподавателя, каждому 10 с ИИ и 10 вручную, второму противоположное условие; случайный порядок, без повторного оценивания того же ответа тем же преподавателем, всего 40 сессий. Знакомство экспертов с набором при калибровке ограничивает переносимость.\n\nПОРОГИ ОПЫТА — НЕ РЕЗУЛЬТАТЫ. Медиана времени преподавателя ниже ≥20%, полная задержка API измеряется отдельно; средняя абсолютная ошибка предложения ≤10 п.п. максимума рубрики; доля итоговых человеческих проверок с ошибкой >20 п.п. не выше ручного условия; ≥90% комментариев по слепой оценке соответствуют критерию/тексту с отдельным учётом пропусков ошибок; 100% показываемых привязок механически валидны с отчётом покрытия/отказов. Ноль публикаций без преподавателя и ноль доступа к чужим решениям/секретам, все 10 атакующих случаев разобраны вручную. Предложение либо явная ошибка после ≤3 вызовов на работу, денежный потолок соблюдён; сообщить сбои и p50/p95 без заявления SLA. Инъекция в оценку считается ошибкой качества даже при валидном JSON. Нарушение доступа/публикации останавливает опыт, провал любого порога оставляет ИИ выключенным. Успех допускает лишь следующий ограниченный пилот на новом наборе; не доказывает рост успеваемости. Эксперимент не выполнялся.\n\nОТКРЫТЫЕ ВОПРОСЫ (ответов не ожидаем).\nQ1. Предмет, возраст, язык, формат решений? Допущение: взрослые, короткий русский текст без вложений; влияет на рубрику, UI и репрезентативность.\nQ2. Допустима ли передача DeepSeek, каковы юрисдикция, условия и сроки хранения? Допущение: только синтетические данные до решения владельца; ответ может исключить внешний API, юридическая оценка не проводилась.\nQ3. Шкала, пересдачи, дедлайны, апелляции? Допущение: сумма критериев, новые попытки, правка оценки с причиной, дедлайны/апелляции позже; влияет на B и итоговую оценку.\nQ4. Модель, бюджет, квоты и задержки API? Допущение: ИИ выключен до выбора модели и денежного потолка; влияет на границы опыта.\nQ5. Нагрузка и требования восстановления? Допущение: демо без HA/SLA; влияет на ресурсы/эксплуатацию.\nQ6. Выдача и совмещение ролей, коды вступления? Допущение: оператор Keycloak выдаёт роли, совмещение допустимо, доступ по курсу; влияет на онбординг/авторизацию.\nQ7. Как совместить историю с удалением персональных данных и backup? Допущение: в демо нет пользовательского удаления истории; до реальных данных согласовать сроки, обезличивание, удаление и backup.\nQ8. Что важнее: объяснение, доработка или повторный ввод? Допущение: A по соответствию требованиям; спрос/повторяемость не подтверждены, ответ может изменить приоритет A/B/C.\n\nОГРАНИЧЕНИЯ И ПЕРЕДАЧА. Сложность предварительная и относительная, только добавка к общей основе, не оценка всей инфраструктуры. Нет данных о команде/скорости/нагрузке: калиброванный прогноз сроков не обещается. Нет интервью, UX-опытов, конкурентного обзора, доказанной педагогической пользы, API/нагрузочных/безопасностных тестов и подтверждённой совместимости. Малые выборки — только предварительный сигнал. Сделано: три сравнимые концепции, критерии/сценарии/риски/основания/гипотезы, рекомендация, минимум/опции, архитектурные рамки, отдельный опыт и вопросы. Остаётся: проверить потребность, уточнить вопросы/политику данных, затем решить о прототипе и будущей приёмке. Ловушки: не выдавать гипотезы за измерения, не объединять все идеи в MVP, не обещать сроки/exactly-once/устойчивость к инъекциям, не переносить старый repository-baseline на текущий commit. Продукт не реализован. Меняются только BRAINSTORM.md и brainstorm.yaml; HANDOFF.md и запрещённый .orchestra/questions.jsonl не изменялись. Из-за additionalProperties=false вопросы и передача находятся в summary; новых полей нет. JSON-совместимый синтаксис YAML 1.2.\n\nПроверка артефактов: payload разобран как JSON-совместимый YAML 1.2; встроенная проверка всех ограничений supplied JSON Schema пройдена, включая запрет лишних полей и четыре отрицательных контрольных примера. Проверены три уникальных ID, наличие Q1–Q8 в обоих файлах, локальные ссылки и ограничение изменённых путей двумя разрешёнными файлами. Это проверка документов; продуктовые тесты и опыт DeepSeek не выполнялись.",
